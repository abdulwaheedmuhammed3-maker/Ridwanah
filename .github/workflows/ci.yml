name: Validate Ridwanah

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build static website
        run: npm run build
      - name: Audit generated pages and internal links
        run: npm run audit
      - name: Audit health content source integrity
        run: npm run audit:sources
      - name: Check Cloudflare deployment script syntax
        run: node --check scripts/deploy-cloudflare-worker.mjs
      - name: Test preview IP access gate
        run: npm run test:worker-access
      - name: Validate Cloudflare deployment without credentials
        run: npm run cloudflare:dry-run
      - name: Install Chromium for responsive browser tests
        run: npx playwright install --with-deps chromium
      - name: Test desktop, tablet and Android-sized layouts
        run: npm run test:e2e
