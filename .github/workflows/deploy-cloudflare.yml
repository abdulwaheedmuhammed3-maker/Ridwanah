name: Guarded preview deployment required

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prevent-unguarded-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Stop an assets-only deployment
        run: |
          echo "::error::This deployment is disabled while the preview IP gate is active."
          echo "An assets-only upload would replace the Worker middleware and expose the preview."
          echo "Use the guarded Worker-and-assets deployment procedure documented in docs/cloudflare-deployment.md."
          exit 1
