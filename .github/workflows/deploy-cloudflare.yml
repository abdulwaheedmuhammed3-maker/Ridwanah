name: Deploy Ridwanah preview to Cloudflare

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Confirm deployment to the restricted Ridwanah preview workers.dev URL"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ridwanah-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static website
        run: npm run build

      - name: Audit generated pages and internal links
        run: npm run audit

      - name: Test preview IP access gate
        run: npm run test:worker-access

      - name: Verify deployment credentials and allowlist secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RIDWANAH_PREVIEW_ALLOWED_IP: ${{ secrets.RIDWANAH_PREVIEW_ALLOWED_IP }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; }
          test -n "$RIDWANAH_PREVIEW_ALLOWED_IP" || { echo "Missing RIDWANAH_PREVIEW_ALLOWED_IP repository secret."; exit 1; }

      - name: Prepare private Worker secrets file
        env:
          RIDWANAH_PREVIEW_ALLOWED_IP: ${{ secrets.RIDWANAH_PREVIEW_ALLOWED_IP }}
        run: |
          printf 'PREVIEW_ALLOWED_IP=%s\n' "$RIDWANAH_PREVIEW_ALLOWED_IP" > .secrets
          chmod 600 .secrets

      - name: Deploy Worker and static assets to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx cf deploy \
            --secrets-file .secrets \
            --message "Ridwanah restricted preview release $GITHUB_SHA" \
            --tag "github-$GITHUB_RUN_NUMBER"

      - name: Remove temporary secrets file
        if: always()
        run: rm -f .secrets
