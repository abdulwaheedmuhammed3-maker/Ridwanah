name: Deploy Ridwanah preview to Cloudflare

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Confirm deployment to the public Ridwanah workers.dev URL"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ridwanah-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.publish == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static website
        run: npm run build

      - name: Audit generated pages and internal links
        run: npm run audit

      - name: Verify deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; }

      - name: Deploy static assets to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx cf deploy ./dist \
            --message "Ridwanah release $GITHUB_SHA" \
            --tag "github-$GITHUB_RUN_NUMBER"
